<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf6">

<meta name="description" content="微笑娜生活萬用計算機™｜基礎計算、匯率、服務費分攤、回饋、BMI、BMR、折扣、單價、油耗、貸款、房貸、尺寸與溫度換算。">
<meta name="robots" content="index,follow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="微笑娜生活萬用計算機">

<title>微笑娜生活萬用計算機™ v1.9｜Web Ready</title>
<style>
:root{
  --bg:#fffaf6; --card:#ffffff; --text:#3d3a38; --muted:#8b817b;
  --line:#eee3dc; --accent:#e88d86; --accent2:#f7d8cb; --soft:#fff0e9;
  --good:#2f7d62; --shadow:0 6px 22px rgba(80,55,45,.08);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}
.header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 84%,rgba(255,250,246,0));padding:14px 2px 10px}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand h1{font-size:20px;line-height:1.25;margin:0;font-weight:800}
.brand .ver{font-size:12px;color:var(--muted);margin-top:4px}
.iconbtn{border:0;background:#fff;width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow);font-size:18px}
.search{margin-top:12px;position:relative}
.search input{width:100%;height:52px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:0 16px 0 44px;outline:none;font-size:16px;box-shadow:0 3px 12px rgba(80,55,45,.04)}
.search span{position:absolute;left:16px;top:15px;font-size:19px}
.chips{display:flex;gap:8px;overflow:auto;padding:3px 1px 9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;color:var(--muted);font-size:14px}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:10px 3px 9px}
.sectionTitle b{font-size:16px}
.sectionTitle small{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border:1px solid var(--line);background:var(--card);border-radius:19px;padding:14px;min-height:112px;text-align:left;box-shadow:0 3px 14px rgba(80,55,45,.04);position:relative;display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;cursor:pointer}
.tool:active{transform:scale(.985)}
.tool .emoji{font-size:25px}
.tool .name{font-weight:750;margin-top:9px;font-size:15px;line-height:1.3;padding-right:28px}
.tool .sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45;padding-right:22px}
.star{position:absolute;right:9px;top:8px;width:32px;height:32px;border:0;background:transparent;font-size:18px;color:#c8bbb4}
.star.on{color:#e5a21a}
.empty{grid-column:1/-1;padding:34px 12px;text-align:center;color:var(--muted)}
.footerNote{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin:24px 0 4px}
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(35,28,25,.28)}
.sheet.show{display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:480px;max-height:93vh;background:var(--bg);border-radius:28px 28px 0 0;overflow:auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.14)}
.handle{width:42px;height:5px;border-radius:99px;background:#d8cdc7;margin:2px auto 12px}
.panelHead{position:sticky;top:-10px;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.back{width:44px;height:44px;border:0;background:#fff;border-radius:14px;font-size:21px}
.panelTitle{flex:1}
.panelTitle b{display:block;font-size:19px}
.panelTitle small{color:var(--muted)}
.calcCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.label{display:block;font-size:13px;color:var(--muted);margin:2px 0 7px}
.field,.select{width:100%;height:52px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 13px;font-size:18px;outline:none}
.field:focus,.select:focus{border-color:#eab2a7;box-shadow:0 0 0 3px #fff1ed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swap{width:48px;height:48px;border:0;border-radius:15px;background:var(--soft);font-size:20px;margin:10px auto;display:block}
.primary{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--text);color:#fff;font-weight:760;font-size:16px;margin-top:12px}
.secondary{width:100%;min-height:50px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--text);font-weight:650;margin-top:9px}
.result{background:linear-gradient(135deg,#fff0e9,#fff8f4);border:1px solid #f5d9cd;border-radius:20px;padding:16px;margin-top:14px}
.result .big{font-size:30px;font-weight:850;line-height:1.2;word-break:break-word}
.result .caption{font-size:17px;color:var(--muted);margin-top:10px;line-height:1.75;font-weight:580}
.info{font-size:13px;color:var(--muted);line-height:1.7;background:#fff;border:1px dashed var(--line);padding:12px 14px;border-radius:16px;margin-top:10px}
.kbd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kbd button{height:58px;border:0;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:21px;font-weight:700}
.kbd .op{background:var(--soft)}
.kbd .eq{background:var(--text);color:#fff}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px}
.pill.on{background:var(--text);color:#fff}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.noteStrong{color:#7b554a;font-weight:700}
@media(min-width:700px){
  body{background:#f6eee9}
  .app{background:var(--bg);box-shadow:0 0 50px rgba(70,50,40,.10)}
}

.linksArea{margin:28px 0 8px;border-top:1px solid var(--line);padding-top:22px}
.linksTitle{font-size:18px;font-weight:850;margin:0 2px 12px}
.linkGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkCard{display:block;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;min-height:112px;box-shadow:0 3px 14px rgba(80,55,45,.04)}
.linkCard:active{transform:scale(.985)}
.linkCard .lemoji{font-size:24px}
.linkCard b{display:block;font-size:15px;margin-top:7px}
.linkCard small{display:block;color:var(--muted);line-height:1.45;margin-top:5px}
.linkCard.primaryLink{background:var(--soft)}


.characterWelcome{position:relative;height:92px;margin:12px 0 16px;overflow:hidden;border-radius:22px;background:linear-gradient(90deg,#fff7f2,#fff)}
.characterWelcome img{position:absolute;right:5px;bottom:-18px;width:158px;height:auto;mix-blend-mode:multiply}
.cwText{position:absolute;left:18px;top:20px;max-width:52%;font-size:14px;line-height:1.5;color:var(--muted)}.cwText b{display:block;color:var(--text);font-size:17px;margin-bottom:3px}
.walletBuddy{position:relative;margin:22px 0 6px;min-height:112px;border-radius:22px;background:var(--soft);overflow:hidden;padding:20px 132px 18px 20px}
.walletBuddy img{position:absolute;right:10px;bottom:-10px;width:118px;height:auto;mix-blend-mode:multiply}.walletBuddy b{display:block;font-size:17px;margin-bottom:6px}.walletBuddy span{font-size:13px;color:var(--muted);line-height:1.55}
.segTabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}.segTabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:13px}.segTabs button.active{background:var(--dark);color:#fff}
.convertGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.convertBox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.convertBox b{display:block;font-size:13px;margin-bottom:5px}.convertBox span{font-size:18px;font-weight:800;word-break:break-word}

/* v1.8：角色完整露出版 */
.characterWelcome{height:104px}
.characterWelcome img{width:142px;right:10px;bottom:-4px}
.walletBuddy{min-height:126px;padding-right:142px}
.walletBuddy img{width:100px;right:18px;bottom:4px}


/* v1.9：首頁人物完整收框＋Web Ready */
.characterWelcome{
  height:116px;
  padding-right:165px;
}
.characterWelcome img{
  width:126px;
  right:18px;
  bottom:8px;
  max-height:96px;
  object-fit:contain;
}
.characterWelcome .cwText,
.cwText{
  top:24px;
  max-width:54%;
}
@media (max-width:380px){
  .characterWelcome{
    height:122px;
    padding-right:145px;
  }
  .characterWelcome img{
    width:112px;
    right:12px;
    bottom:10px;
    max-height:90px;
  }
  .characterWelcome .cwText,
  .cwText{
    max-width:56%;
    font-size:13px;
  }
}

</style>
</head>

<script>
const $=s=>document.querySelector(s);
const nf=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2});
const money=n=>nf.format(Number(n||0));
const num=v=>Number(String(v??'').replace(/,/g,''))||0;
const today=()=>new Date().toLocaleDateString('zh-TW');

const tools=[
{id:'basic',cat:'基本',emoji:'🧮',name:'基礎計算機',sub:'加減乘除'},
{id:'fx',cat:'即時',emoji:'💱',name:'每日匯率',sub:'免費即時日參考匯率'},
{id:'tip',cat:'金錢',emoji:'🍽️',name:'服務費計算機',sub:'服務費・多人分攤'},
{id:'reward',cat:'金錢',emoji:'🎁',name:'回饋計算機',sub:'金額・比例・份數・層數'},
{id:'bmi',cat:'身體',emoji:'⚖️',name:'BMI 計算機',sub:'身高・體重'},
{id:'bmr',cat:'身體',emoji:'🔥',name:'基礎代謝 BMR',sub:'每日基礎消耗估算'},
{id:'discount',cat:'購物',emoji:'🏷️',name:'折扣計算機',sub:'折後價・省多少'},
{id:'unitprice',cat:'購物',emoji:'🛒',name:'單價比較',sub:'哪一個比較划算'},
{id:'fuelcost',cat:'交通',emoji:'🚗',name:'油耗成本',sub:'公里數算油錢'},
{id:'fuel',cat:'即時',emoji:'⛽',name:'加油計算機',sub:'92・95・98・柴油'},
{id:'loan',cat:'金錢',emoji:'🏦',name:'貸款計算機',sub:'月付・總利息'},
{id:'mortgage',cat:'金錢',emoji:'🏠',name:'房貸利率差',sub:'升息多付多少'},
{id:'saving',cat:'金錢',emoji:'🐷',name:'儲蓄計算機',sub:'複利・定期投入'},
{id:'tax',cat:'金錢',emoji:'🧾',name:'營業稅計算機',sub:'含稅・未稅'},
{id:'date',cat:'日期',emoji:'📅',name:'日期計算機',sub:'相隔天數'},
{id:'age',cat:'日期',emoji:'🎂',name:'年齡計算機',sub:'精確到年月日'},
{id:'average',cat:'基本',emoji:'📊',name:'平均值計算機',sub:'多個數字快速平均'},
{id:'percent',cat:'基本',emoji:'％',name:'百分比計算機',sub:'比例・增減幅'},
{id:'measure',cat:'基本',emoji:'📏',name:'尺寸換算',sub:'長度・坪數・重量・容量'},
{id:'temp',cat:'基本',emoji:'🌡️',name:'溫度換算',sub:'°C・°F'},
{id:'time',cat:'日期',emoji:'🌍',name:'世界時間',sub:'台北・東京・紐約等'},
{id:'hex',cat:'基本',emoji:'🔢',name:'進位轉換器',sub:'2・8・10・16 進位'}
];

let favorites=JSON.parse(localStorage.getItem('nina_calc_favs')||'[]');
let recent=JSON.parse(localStorage.getItem('nina_calc_recent')||'[]');
let cat='全部', favMode=false, current=null;

const cats=['全部','常用','即時','購物','金錢','交通','日期','身體','基本'];
function renderChips(){
 $('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){cat=c;favMode=false;$('#favOnly').textContent='☆';render();}
function toggleFav(id,e){
 if(e)e.stopPropagation();
 favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];
 localStorage.setItem('nina_calc_favs',JSON.stringify(favorites)); render();
 if(current===id) $('#panelStar').textContent=favorites.includes(id)?'★':'☆';
}
function render(){
 renderChips();
 let q=$('#q').value.trim().toLowerCase();
 let arr=tools.filter(t=>{
   const okq=!q||(t.name+t.sub+t.cat).toLowerCase().includes(q);
   const okc=cat==='全部'||(cat==='常用'?recent.slice(0,6).includes(t.id):t.cat===cat);
   const okf=!favMode||favorites.includes(t.id);
   return okq&&okc&&okf;
 });
 if(cat==='常用') arr.sort((a,b)=>recent.indexOf(a.id)-recent.indexOf(b.id));
 $('#listTitle').textContent=favMode?'我的收藏':(cat==='全部'?'全部計算機':cat==='常用'?'最近使用':cat);
 $('#count').textContent=arr.length+' 個';
 $('#grid').innerHTML=arr.length?arr.map(t=>`
   <div class="tool" role="button" tabindex="0"
        onclick="openTool('${t.id}')"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTool('${t.id}')}">
     <button class="star ${favorites.includes(t.id)?'on':''}" aria-label="收藏 ${t.name}"
             onclick="toggleFav('${t.id}',event)">${favorites.includes(t.id)?'★':'☆'}</button>
     <div class="emoji">${t.emoji}</div>
     <div class="name">${t.name}</div>
     <div class="sub">${t.sub}</div>
   </div>`).join(''):`<div class="empty">找不到這台計算機 (˶ᵔ ᵕ ᵔ˶)<br>換個關鍵字試試看。</div>`;
}
$('#q').addEventListener('input',render);
$('#favOnly').onclick=()=>{favMode=!favMode;$('#favOnly').textContent=favMode?'★':'☆';render()};
function pushRecent(id){recent=[id,...recent.filter(x=>x!==id)].slice(0,8);localStorage.setItem('nina_calc_recent',JSON.stringify(recent))}
function openTool(id){
 current=id; pushRecent(id);
 const t=tools.find(x=>x.id===id);
 $('#ptitle').textContent=t.emoji+' '+t.name; $('#psub').textContent=t.sub;
 $('#panelStar').textContent=favorites.includes(id)?'★':'☆';
 $('#panelStar').onclick=()=>toggleFav(id);
 $('#calc').innerHTML=builders[id]();
 $('#sheet').classList.add('show'); document.body.style.overflow='hidden';
 if(initters[id]) initters[id]();
}
function closeSheet(){ $('#sheet').classList.remove('show');document.body.style.overflow='';render()}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
function result(big,cap=''){return `<div class="result"><div class="big">${big}</div><div class="caption">${cap}</div></div>`}
function input(id,label,ph='',val='',type='number'){return `<label class="label">${label}</label><input class="field" id="${id}" type="${type}" inputmode="${type==='number'?'decimal':'text'}" placeholder="${ph}" value="${val}">`}
function sel(id,label,opts){return `<label class="label">${label}</label><select class="select" id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`}

const builders={
basic:()=>`<div class="calcCard">${input('disp','算式','','','text')}<div class="kbd">
${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+'].map(x=>`<button class="${'÷×−+'.includes(x)?'op':''}" onclick="key('${x}')">${x}</button>`).join('')}
<button class="eq" style="grid-column:1/-1" onclick="equals()">＝</button></div><div id="out"></div></div>`,
reward:()=>`<div class="calcCard">
<div class="info" style="margin-top:0">
  一般回饋試算：每層可自己填「單份金額 × 份數」，回饋率也可自訂。<br>
  份數不設上限，最多可展開 7 層。
</div>
${input('rewardRate','回饋比例 %','','4')}
<div class="sectionTitle" style="margin:16px 0 8px"><b>層級明細</b><small>最多 7 層</small></div>
<div id="rewardRows"></div>
<button class="secondary" onclick="addRewardLevel()">＋ 增加一層</button>
<button class="primary" onclick="calcReward()">計算總回饋</button>
<div id="out"></div>
<div class="info">
  計算方式：Σ（每層單份金額 × 份數）× 回饋比例。<br>
  這是一台通用試算工具，不代表任何特定平台的實際結算結果。
</div>
</div>`,
discount:()=>`<div class="calcCard">
${input('price','原價','例如 5000')}
${input('disc','折數','例如 79＝79折；7.9 也可以','79')}
<button class="primary" onclick="calcDiscount()">算折後價</button><div id="out"></div>
<div class="info">輸入 79 或 7.9 都會視為「79折」，也就是付原價的 79%。</div>
</div>`,
percent:()=>`<div class="calcCard">${input('pa','原數值','例如 800')}${input('pb','新數值','例如 920')}
<button class="primary" onclick="calcPercent()">算增減幅</button><div id="out"></div></div>`,
unitprice:()=>`<div class="calcCard">
${input('unitName','比較單位','例如：個、包、g、mL','','text')}
<div class="row"><div>${input('aPrice','A 價格','199')}</div><div>${input('aQty','A 數量','5')}</div></div>
<div class="row"><div>${input('bPrice','B 價格','259')}</div><div>${input('bQty','B 數量','6')}</div></div>
<button class="primary" onclick="calcUnit()">比較哪個划算</button><div id="out"></div>
<div class="info">兩邊要使用同一種比較單位。例如：A 200元／5個，B 399元／10個；單位填「個」。</div>
</div>`,

function out(html){$('#out').innerHTML=html}
function key(k){let d=$('#disp'); if(k==='C')d.value=''; else d.value+=(k==='×'?'*':k==='÷'?'/':k==='−'?'-':k)}
function equals(){try{let x=$('#disp').value;if(!/^[0-9+\-*/().\s]+$/.test(x))throw 0;out(result(money(Function('"use strict";return ('+x+')')()),'計算結果'))}catch(e){out(result('算式有點怪','請檢查符號後再試一次'))}}

let rewardLevels=1;
function rewardRow(i,amount='',qty=''){
  return `<div class="rewardLevel" style="border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b>第 ${i} 層</b>
      ${i>1?`<button type="button" style="border:0;background:transparent;color:var(--muted);font-size:14px" onclick="removeRewardLevel(${i})">移除</button>`:''}
    </div>
    <div class="row">
      <div>${input(`rewardAmt${i}`,'單份金額','例如 1000',amount)}</div>
      <div>${input(`rewardQty${i}`,'份數','例如 10',qty)}</div>
    </div>
  </div>`;
}
function initReward(){
  rewardLevels=1;
  $('#rewardRows').innerHTML=rewardRow(1);
}
function addRewardLevel(){
  if(rewardLevels>=7){
    return out(result('最多 7 層','份數本身不設上限，每一層都可以填任意份數。'));
  }
  rewardLevels++;
  $('#rewardRows').insertAdjacentHTML('beforeend',rewardRow(rewardLevels));
}
function removeRewardLevel(i){
  const rows=[...document.querySelectorAll('.rewardLevel')];
  if(rows.length<=1) return;
  rows[i-1]?.remove();
  rewardLevels=document.querySelectorAll('.rewardLevel').length;
  const container=$('#rewardRows');
  const vals=[...container.querySelectorAll('.rewardLevel')].map((row,idx)=>({
    amount: row.querySelector('input[id^="rewardAmt"]')?.value||'',
    qty: row.querySelector('input[id^="rewardQty"]')?.value||''
  }));
  container.innerHTML='';
  vals.forEach((v,idx)=>container.insertAdjacentHTML('beforeend',rewardRow(idx+1,v.amount,v.qty)));
}
function calcReward(){
  const rate=num($('#rewardRate').value);
  if(rate<0) return out(result('請檢查回饋比例','比例不能小於 0'));
  const rows=[...document.querySelectorAll('.rewardLevel')];
  let base=0, totalQty=0, details=[];
  rows.forEach((row,idx)=>{
    const a=num(row.querySelector('input[id^="rewardAmt"]').value);
    const q=num(row.querySelector('input[id^="rewardQty"]').value);
    const subtotal=a*q;
    base+=subtotal;
    totalQty+=q;
    details.push(`第 ${idx+1} 層：$${money(subtotal)}`);
  });
  const reward=base*rate/100;
  out(result(`$ ${money(reward)}`,
    `<b>總計算基礎：</b>$${money(base)}<br><b>總份數：</b>${money(totalQty)} 份<br><b>回饋比例：</b>${money(rate)}%<br><b>層數：</b>${rows.length} 層<br>${details.join(' ・ ')}`));
}

function calcDiscount(){
  let p=num($('#price').value),d=num($('#disc').value);
  if(p<0||d<0)return out(result('請檢查輸入數字'));
  let payRatio;
  if(d<=10){ payRatio=d/10; } else { payRatio=d/100; }
  if(payRatio>1)return out(result('折數請輸入 100 以下','例如 79 或 7.9 都代表 79折'));
  let final=p*payRatio;
  let saved=p-final;
  let displayFold=(payRatio*100).toFixed(payRatio*100%1===0?0:1);
  out(result('$ '+money(final),`省下 $ ${money(saved)} ・ ${displayFold}折 ・ 付原價 ${(payRatio*100).toFixed(1)}%`))
}
function calcPercent(){let a=num($('#pa').value),b=num($('#pb').value);if(!a)return out(result('原數值不能是 0'));let r=(b-a)/a*100;out(result((r>=0?'+':'')+r.toFixed(2)+'%',`從 ${money(a)} 變成 ${money(b)}，${r>=0?'增加':'減少'} ${money(Math.abs(b-a))}`))}
function calcUnit(){
  let ap=num($('#aPrice').value),aq=num($('#aQty').value),bp=num($('#bPrice').value),bq=num($('#bQty').value);
  let unit=($('#unitName').value||'單位').trim();
  if(!aq||!bq)return out(result('數量不能是 0','請輸入 A、B 各自包含多少 '+unit));
  let a=ap/aq,b=bp/bq;
  let win=a<b?'A':b<a?'B':'一樣';
  let diff=a===b?0:Math.abs(a-b)/Math.max(a,b)*100;
  out(result(win==='一樣'?'兩個一樣划算':`${win} 比較划算`,
    `<b>A：</b>$${money(a)}／${unit}<br><b>B：</b>$${money(b)}／${unit}<br>${win==='一樣'?'兩者單價相同':`約便宜 ${diff.toFixed(1)}%`}`))
}
function calcTax(){let a=num($('#taxAmount').value),r=num($('#taxRate').value)/100,m=$('#taxMode').value;if(m==='pre'){out(result('$ '+money(a*(1+r)),`稅額 $${money(a*r)} ・ 未稅 $${money(a)}`))}else{let pre=a/(1+r);out(result('$ '+money(pre),`未稅金額 ・ 稅額 $${money(a-pre)} ・ 含稅 $${money(a)}`))}}
function calcTip(){
 let a=num($('#tipBase').value),rate=num($('#tipRate').value),people=Math.max(1,Math.floor(num($('#tipPeople').value)||1));
 let fee=a*rate/100,total=a+fee,each=total/people;
 out(result(`每人 $ ${money(each)}`,`服務費 $${money(fee)} ・ 含服務費總額 $${money(total)} ・ ${people} 人分攤`))
}

const FX_FALLBACK = {
  date:'離線示範值',
  base:'TWD',
  // 僅供 content:// / file:// 本機測試介面與計算流程；正式 https 會優先抓即時公開匯率。
  rates:{TWD:1,USD:0.0306,JPY:4.53,EUR:0.0262,GBP:0.0227,KRW:42.65,CNY:0.213,HKD:0.238,AUD:0.0468,CAD:0.0422,SGD:0.0393}
};
function fallbackFxRate(from,to){
  const r=FX_FALLBACK.rates;
  if(!r[from]||!r[to]) return NaN;
  return r[to]/r[from];
}

async function loadFx(){
  const btn=$('#fxGo');
  if(btn){btn.textContent='換算中…';btn.disabled=true;}
  const amt=num($('#fxAmt').value), f=$('#fxFrom').value, t=$('#fxTo').value;
  if(f===t){ if(btn){btn.textContent='取得匯率並換算';btn.disabled=false;} return out(result(`${money(amt)} ${t}`,'同一幣別，匯率為 1')); }

  const local=(location.protocol==='content:' || location.protocol==='file:');
  if(local){
    const rate=fallbackFxRate(f,t);
    if(Number.isFinite(rate)){
      if(btn){btn.textContent='取得匯率並換算';btn.disabled=false;}
      return out(result(`${money(amt*rate)} ${t}`,
        `離線測試換算 ・ 1 ${f} ≈ ${money(rate)} ${t}<br><span class="noteStrong">目前是手機下載檔示範值，不是今日即時匯率。正式放上 https 網站後會自動取得最新資料。</span>`));
    }
    if(btn){btn.textContent='取得匯率並換算';btn.disabled=false;} return out(result('目前無法換算','這組幣別沒有離線示範資料。'));
  }

  out(result('正在取得今日匯率…','請稍候一下'));
  try{
    const r=await fetch(`https://api.frankfurter.dev/v2/rate/${f}/${t}`,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP');
    const d=await r.json();
    const rate=Number(d.rate);
    if(!Number.isFinite(rate)) throw new Error('BAD_RATE');
    out(result(`${money(amt*rate)} ${t}`,
      `1 ${f} ≈ ${money(rate)} ${t} ・ 資料日 ${d.date||'最新'}<br><span class="live"><span class="dot"></span>線上匯率資料</span>`));
    if(btn){btn.textContent='取得匯率並換算';btn.disabled=false;}
  }catch(e){
    out(result('目前無法取得即時匯率','網路或匯率服務暫時無法連線，請稍後再試。'));
    if(btn){btn.textContent='取得匯率並換算';btn.disabled=false;}
  }
}

const fuelData={date:'2026/08/24',items:{'92':30.5,'95':32.0,'98':34.0,'柴油':29.3}};
let fuelType='95';
function renderFuelPills(){ $('#fuelPills').innerHTML=Object.entries(fuelData.items).map(([k,v])=>`<button class="pill ${fuelType===k?'on':''}" onclick="fuelType='${k}';renderFuelPills()">${k}<br>$${v}</button>`).join('') }
function calcFuel(){let l=num($('#fuelL').value),p=fuelData.items[fuelType];out(result('$ '+money(l*p),`${fuelType} ・ ${l} 公升 × $${p}/L ・ 牌價日 ${fuelData.date}`))}
function calcFuelCost(){let k=num($('#km').value),e=num($('#kmpl').value),p=num($('#fuelp').value);if(!e)return out(result('油耗不能是 0'));let l=k/e;out(result('$ '+money(l*p),`約用 ${l.toFixed(2)} 公升 ・ 每公里約 $${money(p/e)}`))}
function monthlyPayment(P,annual,years){
  P=Number(P); annual=Number(annual); years=Number(years);
  if(!Number.isFinite(P)||!Number.isFinite(annual)||!Number.isFinite(years)||P<=0||years<=0) return NaN;
  const n=Math.round(years*12);
  const r=annual/100/12;
  if(Math.abs(r)<1e-12) return P/n;
  const pow=Math.pow(1+r,n);
  const pay=P*r*pow/(pow-1);
  return Number.isFinite(pay)?pay:NaN;
}
function calcLoan(){let P=num($('#loanP').value),R=num($('#loanR').value),Y=num($('#loanY').value),m=monthlyPayment(P,R,Y),tot=m*Y*12;out(result('$ '+money(m)+'/月',`總繳 $${money(tot)} ・ 總利息約 $${money(tot-P)}`))}
function calcMortgage(){
  const P=num($('#mortP').value);
  const Y=num($('#mortY').value);
  const r1=num($('#mortR1').value);
  const r2=num($('#mortR2').value);
  if(P<=0||Y<=0) return out(result('請檢查本金與年數','本金與剩餘年數都要大於 0'));
  const a=monthlyPayment(P,r1,Y);
  const b=monthlyPayment(P,r2,Y);
  if(!Number.isFinite(a)||!Number.isFinite(b)) return out(result('目前無法計算','請檢查利率格式，例如 1.75、2.45'));
  const diff=b-a;
  const totalDiff=diff*Y*12;
  out(result(`${diff>=0?'+':'−'}$ ${money(Math.abs(diff))}/月`,
    `<b>現在：</b>$${money(a)}/月<br><b>新利率：</b>$${money(b)}/月<br><b>${diff>=0?'整期約多付':'整期約少付'}：</b>$${money(Math.abs(totalDiff))}`));
}
function calcSaving(){let s=num($('#savStart').value),m=num($('#savMonthly').value),R=num($('#savRate').value)/100/12,Y=num($('#savYears').value),n=Y*12;let fv=s*Math.pow(1+R,n)+(R?m*(Math.pow(1+R,n)-1)/R:m*n);let put=s+m*n;out(result('$ '+money(fv),`投入本金 $${money(put)} ・ 估計增值 $${money(fv-put)}`))}
function calcDate(){let a=new Date($('#d1').value),b=new Date($('#d2').value);if(isNaN(a)||isNaN(b))return out(result('請先選兩個日期'));let days=Math.round((b-a)/86400000);out(result(`${Math.abs(days)} 天`,days>=0?'從開始日到結束日':'結束日在開始日之前'))}
function calcAge(){let b=new Date($('#birth').value),n=new Date();if(isNaN(b))return out(result('請先選出生日期'));let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;let prev=new Date(n.getFullYear(),n.getMonth(),0).getDate();d+=prev}if(m<0){y--;m+=12}out(result(`${y} 歲`,`${y} 年 ${m} 個月 ${d} 天`))}
function calcBMI(){let h=num($('#height').value)/100,w=num($('#weight').value);if(!h)return;let b=w/(h*h);let s=b<18.5?'偏輕':b<24?'一般範圍':b<27?'過重':'偏高';out(result(b.toFixed(1),`BMI ${s} ・ 僅供一般生活參考`))}
function calcBMR(){let s=$('#sex').value,a=num($('#bAge').value),h=num($('#bH').value),w=num($('#bW').value);let b=10*w+6.25*h-5*a+(s==='m'?5:-161);out(result(`${Math.round(b)} kcal/日`,'Mifflin-St Jeor 公式估算的基礎代謝量'))}
function showTime(){let tz=$('#tz')?.value||'Asia/Taipei';let s=new Intl.DateTimeFormat('zh-TW',{timeZone:tz,dateStyle:'full',timeStyle:'medium'}).format(new Date());out(result(s,'會依該地時區與夏令時間自動換算'))}
function calcBase(){let v=$('#baseVal').value.trim(),b=Number($('#fromBase').value),n=parseInt(v,b);if(Number.isNaN(n))return out(result('輸入格式不符合原進位'));out(result(n.toString(10),`2進位：${n.toString(2).toUpperCase()}<br>8進位：${n.toString(8).toUpperCase()}<br>10進位：${n}<br>16進位：${n.toString(16).toUpperCase()}`))}
function calcAvg(){let a=$('#avgVals').value.split(/[,，\s]+/).map(Number).filter(x=>!Number.isNaN(x));if(!a.length)return out(result('請輸入數字'));let sum=a.reduce((x,y)=>x+y,0);out(result((sum/a.length).toFixed(2),`${a.length} 個數字 ・ 總和 ${money(sum)}`))}

function niceNum(n){return Math.abs(n)>=100?n.toLocaleString('zh-TW',{maximumFractionDigits:3}):n.toLocaleString('zh-TW',{maximumFractionDigits:6})}
function calcMeasure(){let v=num($('#measureVal').value),u=$('#measureUnit').value,d=measureDefs[currentMeasure],base=v*d[u];let rows=Object.entries(d).map(([n,f])=>`<div class="convertBox"><b>${n}</b><span>${niceNum(base/f)}</span></div>`).join('');out(`<div class="result"><div class="convertGrid">${rows}</div></div>`)}
function calcTemp(){let v=num($('#tempVal').value),u=$('#tempUnit').value,c=u==='c'?v:(v-32)*5/9,f=u==='f'?v:v*9/5+32;out(result(`${niceNum(c)} °C`,`${niceNum(f)} °F`))}
